{% extends 'base.html' %}

{% block title %}Login - Trial Junkie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark text-light shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Login to Trial Junkie</h3>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <div class="mb-3">
                    <a href="{{ url_for('register') }}">Need an account? Register here</a>
                </div>
                <hr>
                <div class="discord-login">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        <img src="{{ url_for('static', filename='img/discord-logo.svg') }}" alt="Discord" width="20" height="20" class="me-2">
                        Login with Discord
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
