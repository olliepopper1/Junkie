{% extends 'base.html' %}

{% block title %}Register - Trial Junkie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark text-light shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Create Your Trial Junkie Account</h3>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                        <label class="form-check-label" for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <div class="mb-3">
                    <a href="{{ url_for('login') }}">Already have an account? Login here</a>
                </div>
                <hr>
                <div class="discord-login">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        <img src="{{ url_for('static', filename='img/discord-logo.svg') }}" alt="Discord" width="20" height="20" class="me-2">
                        Register with Discord
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
