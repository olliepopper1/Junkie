<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .base { fill: #2a2a2a; }
    .face { fill: #3a3a3a; }
    .accent { fill: #ffc107; }
    .eyes { fill: #6f42c1; }
    .mouth { fill: #444; }
    .needle { fill: none; stroke: #b8b8b8; stroke-width: 2; }
    .effects { fill: rgba(255, 193, 7, 0.7); }
    .glow { filter: drop-shadow(0 0 8px #ffc107); }
  </style>
  
  <!-- Background -->
  <circle class="base" cx="100" cy="100" r="95"/>
  
  <!-- Needle -->
  <g class="glow">
    <path class="needle" d="M35,130 L55,110 L165,30" />
    <circle class="accent" cx="55" cy="110" r="5" />
    <path class="needle" d="M55,110 L75,130" />
    <circle class="accent" cx="165" cy="30" r="3" />
  </g>
  
  <!-- Face -->
  <circle class="face" cx="100" cy="110" r="60" />
  
  <!-- Eyes (droopy and half-closed) -->
  <ellipse class="eyes" cx="75" cy="100" rx="12" ry="5" />
  <ellipse class="eyes" cx="125" cy="100" rx="12" ry="5" />
  
  <!-- Pupils -->
  <circle fill="#000" cx="75" cy="100" r="3" />
  <circle fill="#000" cx="125" cy="100" r="3" />
  
  <!-- Eyebrows (relaxed) -->
  <path d="M60,85 Q75,80 90,85" stroke="#555" stroke-width="3" fill="none" />
  <path d="M110,85 Q125,80 140,85" stroke="#555" stroke-width="3" fill="none" />
  
  <!-- Mouth (slight smile) -->
  <path class="mouth" d="M80,135 Q100,145 120,135" stroke="#555" stroke-width="2" fill="none" />
  
  <!-- Yellow effects (heroin glow) -->
  <g class="effects" opacity="0.3">
    <circle cx="65" cy="100" r="20" />
    <circle cx="135" cy="100" r="20" />
    <circle cx="100" cy="130" r="15" />
  </g>
</svg>