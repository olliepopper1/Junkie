<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: #2a2a2a; }
    .card-outline { fill: none; stroke: #6f42c1; stroke-width: 2; }
    .card-stripe { fill: #20c997; }
    .card-chip { fill: #f0ad4e; }
  </style>
  
  <!-- Card background -->
  <rect class="card-bg" x="4" y="12" width="56" height="40" rx="4" ry="4"/>
  
  <!-- Card outline -->
  <rect class="card-outline" x="4" y="12" width="56" height="40" rx="4" ry="4"/>
  
  <!-- Card magnetic stripe -->
  <rect class="card-stripe" x="4" y="18" width="56" height="8"/>
  
  <!-- Card chip -->
  <rect class="card-chip" x="12" y="32" width="12" height="10" rx="2" ry="2"/>
  
  <!-- Card number (dots) -->
  <circle fill="white" cx="36" cy="36" r="1"/>
  <circle fill="white" cx="40" cy="36" r="1"/>
  <circle fill="white" cx="44" cy="36" r="1"/>
  <circle fill="white" cx="48" cy="36" r="1"/>
  
  <circle fill="white" cx="36" cy="40" r="1"/>
  <circle fill="white" cx="40" cy="40" r="1"/>
  <circle fill="white" cx="44" cy="40" r="1"/>
  <circle fill="white" cx="48" cy="40" r="1"/>
</svg>