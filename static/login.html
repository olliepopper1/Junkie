<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trial Junkie</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <style>
        body {
            background-color: #141414;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(circle at center, #232323 0%, #141414 100%);
        }
        
        .login-container {
            max-width: 480px;
            margin: 50px auto;
            background-color: rgba(24, 26, 27, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #9a43f2 0%, #4adede 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(154, 67, 242, 0.3);
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            font-size: 1rem;
            color: #aaa;
        }
        
        .form-floating .form-control {
            background-color: rgba(33, 37, 41, 0.8);
            border: 1px solid #343a40;
            color: #f8f9fa;
            height: calc(3.5rem + 2px);
            padding: 1rem 0.75rem;
        }
        
        .form-floating label {
            padding: 1rem 0.75rem;
        }
        
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            color: #adb5bd;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #9a43f2 0%, #4adede 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(154, 67, 242, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(154, 67, 242, 0.5);
        }
        
        .drug-icon {
            position: absolute;
            opacity: 0.1;
            font-size: 4rem;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .icon-1 {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            font-size: 3rem;
        }
        
        .icon-2 {
            top: 20%;
            right: 10%;
            animation-delay: 1s;
            font-size: 2.5rem;
        }
        
        .icon-3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
            font-size: 3.5rem;
        }
        
        .icon-4 {
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
            font-size: 3rem;
        }
        
        .form-group {
            position: relative;
            z-index: 1;
            margin-bottom: 1.5rem;
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #adb5bd;
        }
        
        .register-link a {
            color: #4adede;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            color: #9a43f2;
            text-decoration: underline;
        }
        
        .error-message {
            background-color: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(220, 53, 69, 0.3);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <!-- Background drug icons -->
            <div class="drug-icon icon-1">💉</div>
            <div class="drug-icon icon-2">💊</div>
            <div class="drug-icon icon-3">🍄</div>
            <div class="drug-icon icon-4">🌿</div>
            
            <div class="logo">
                <h1>Trial Junkie</h1>
                <p>Get your digital fix</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                Invalid credentials. Please try again.
            </div>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        <label for="username">Username</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        <label for="password">Password</label>
                    </div>
                </div>
                
                <div class="options">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="/forgot-password" class="text-info">Forgot password?</a>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>

                <div class="text-center my-3">
                    <div class="divider d-flex align-items-center justify-content-center">
                        <span class="mx-2 text-muted">OR</span>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <a href="/login-with-discord" class="btn btn-lg text-white" style="background-color: #5865F2;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-discord me-2" viewBox="0 0 16 16">
                            <path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.03.03.052.052 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019Zm-8.198 7.307c-.789 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612Zm5.316 0c-.788 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612Z"/>
                        </svg>
                        Login with Discord
                    </a>
                </div>
                
                <div class="register-link">
                    Don't have an account? <a href="/register">Register now</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Check for error parameter in URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.getElementById('errorMessage').classList.add('show');
            }
        });
    </script>
</body>
</html>
