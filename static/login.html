<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trial Junkie</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <style>
        body {
            background-color: #141414;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(circle at center, #232323 0%, #141414 100%);
        }
        
        .login-container {
            max-width: 480px;
            margin: 50px auto;
            background-color: rgba(24, 26, 27, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #9a43f2 0%, #4adede 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(154, 67, 242, 0.3);
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            font-size: 1rem;
            color: #aaa;
        }
        
        .form-floating .form-control {
            background-color: rgba(33, 37, 41, 0.8);
            border: 1px solid #343a40;
            color: #f8f9fa;
            height: calc(3.5rem + 2px);
            padding: 1rem 0.75rem;
        }
        
        .form-floating label {
            padding: 1rem 0.75rem;
        }
        
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            color: #adb5bd;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #9a43f2 0%, #4adede 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(154, 67, 242, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(154, 67, 242, 0.5);
        }
        
        .drug-icon {
            position: absolute;
            opacity: 0.1;
            font-size: 4rem;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .icon-1 {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            font-size: 3rem;
        }
        
        .icon-2 {
            top: 20%;
            right: 10%;
            animation-delay: 1s;
            font-size: 2.5rem;
        }
        
        .icon-3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
            font-size: 3.5rem;
        }
        
        .icon-4 {
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
            font-size: 3rem;
        }
        
        .form-group {
            position: relative;
            z-index: 1;
            margin-bottom: 1.5rem;
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #adb5bd;
        }
        
        .register-link a {
            color: #4adede;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            color: #9a43f2;
            text-decoration: underline;
        }
        
        .error-message {
            background-color: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(220, 53, 69, 0.3);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <!-- Background drug icons -->
            <div class="drug-icon icon-1">💉</div>
            <div class="drug-icon icon-2">💊</div>
            <div class="drug-icon icon-3">🍄</div>
            <div class="drug-icon icon-4">🌿</div>
            
            <div class="logo">
                <h1>Trial Junkie</h1>
                <p>Get your digital fix</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                Invalid credentials. Please try again.
            </div>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        <label for="username">Username</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        <label for="password">Password</label>
                    </div>
                </div>
                
                <div class="options">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="/forgot-password" class="text-info">Forgot password?</a>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>

                <div class="text-center my-3">
                    <div class="divider d-flex align-items-center justify-content-center">
                        <span class="mx-2 text-muted">OR</span>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button id="connect-wallet-btn" class="btn btn-lg text-white" style="background-color: #9945FF; display: flex; align-items: center; justify-content: center;">
                        <img src="/img/phantom-icon.svg" width="20" height="20" alt="Phantom" class="me-2">
                        Login with Phantom Wallet
                    </button>
                    <div id="wallet-info" class="d-none">
                        <div class="alert alert-success mt-3 d-flex align-items-center">
                            <span id="wallet-status-icon" class="me-2">✓</span>
                            <div>
                                <div>Connected as: <span id="wallet-address-display" class="fw-bold"></span></div>
                                <small id="wallet-balance-display"></small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="register-link">
                    Don't have an account? <a href="/register">Register now</a>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Solana Web3 library -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <script src="/js/phantom-wallet.js"></script>
    
    <script>
        // Check for error parameter in URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.getElementById('errorMessage').classList.add('show');
            }
            
            // Set up wallet login
            const connectWalletBtn = document.getElementById('connect-wallet-btn');
            const walletInfo = document.getElementById('wallet-info');
            const walletAddressDisplay = document.getElementById('wallet-address-display');
            const walletBalanceDisplay = document.getElementById('wallet-balance-display');
            
            // Check if Phantom is installed
            const isPhantomInstalled = window.phantom?.solana?.isPhantom;
            if (!isPhantomInstalled) {
                connectWalletBtn.textContent = "Phantom Wallet Not Installed";
                connectWalletBtn.disabled = true;
                return;
            }
            
            // Define wallet connection function
            async function handleWalletLogin() {
                try {
                    // Connect to the wallet
                    const provider = window.phantom?.solana;
                    const resp = await provider.connect();
                    const walletAddress = resp.publicKey.toString();
                    
                    // Display wallet info
                    walletAddressDisplay.textContent = shortenAddress(walletAddress);
                    walletInfo.classList.remove('d-none');
                    connectWalletBtn.classList.add('d-none');
                    
                    // Get wallet balance
                    try {
                        const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
                        const balance = await connection.getBalance(new solanaWeb3.PublicKey(walletAddress));
                        const solBalance = balance / 1000000000; // Convert lamports to SOL
                        walletBalanceDisplay.textContent = `Balance: ${solBalance.toFixed(4)} SOL`;
                    } catch (error) {
                        walletBalanceDisplay.textContent = `Balance: Unknown`;
                    }
                    
                    // Send wallet address to server
                    fetch('/api/login-with-wallet', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ wallet_address: walletAddress })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = '/dashboard';
                        } else {
                            alert(data.message || 'Error logging in with wallet');
                        }
                    })
                    .catch(error => {
                        console.error('Error logging in with wallet:', error);
                        alert('Could not log in with wallet. Please try again.');
                    });
                    
                } catch (error) {
                    console.error('Error connecting to wallet:', error);
                    alert('Could not connect to Phantom wallet. Please try again.');
                }
            }
            
            // Helper to shorten address for display
            function shortenAddress(address) {
                if (!address) return '';
                return address.slice(0, 6) + '...' + address.slice(-4);
            }
            
            // Add event listener to connect button
            connectWalletBtn.addEventListener('click', handleWalletLogin);
            
            // Check for existing connection
            async function checkExistingConnection() {
                try {
                    const provider = window.phantom?.solana;
                    const resp = await provider.connect({ onlyIfTrusted: true });
                    if (resp && resp.publicKey) {
                        const walletAddress = resp.publicKey.toString();
                        walletAddressDisplay.textContent = shortenAddress(walletAddress);
                        walletInfo.classList.remove('d-none');
                        connectWalletBtn.classList.add('d-none');
                    }
                } catch (error) {
                    // Not already connected, do nothing
                }
            }
            
            // Check for existing wallet connection
            checkExistingConnection();
        });
    </script>
</body>
</html>
