<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1e1e1e; }
    .accent1 { fill: #6f42c1; }
    .accent2 { fill: #20c997; }
    .accent3 { fill: #ffc107; }
    .accent4 { fill: #dc3545; }
    .text { fill: #fff; font-family: Arial, sans-serif; }
    .title { font-size: 36px; font-weight: bold; }
    .subtitle { font-size: 18px; }
    .glow1 { filter: drop-shadow(0 0 8px #6f42c1); }
    .glow2 { filter: drop-shadow(0 0 8px #20c997); }
    .glow3 { filter: drop-shadow(0 0 8px #ffc107); }
    .glow4 { filter: drop-shadow(0 0 8px #dc3545); }
  </style>
  
  <!-- Background -->
  <rect class="bg" x="0" y="0" width="640" height="360" rx="10" />
  
  <!-- Lab Environment -->
  <g>
    <!-- Walls and Floor -->
    <rect fill="#191919" x="40" y="60" width="560" height="260" rx="5" />
    <rect fill="#151515" x="60" y="80" width="520" height="240" />
    
    <!-- Grid lines on floor -->
    <g stroke="#333" stroke-width="1">
      <line x1="60" y1="120" x2="580" y2="120" />
      <line x1="60" y1="160" x2="580" y2="160" />
      <line x1="60" y1="200" x2="580" y2="200" />
      <line x1="60" y1="240" x2="580" y2="240" />
      <line x1="60" y1="280" x2="580" y2="280" />
      
      <line x1="100" y1="80" x2="100" y2="320" />
      <line x1="180" y1="80" x2="180" y2="320" />
      <line x1="260" y1="80" x2="260" y2="320" />
      <line x1="340" y1="80" x2="340" y2="320" />
      <line x1="420" y1="80" x2="420" y2="320" />
      <line x1="500" y1="80" x2="500" y2="320" />
    </g>
  </g>
  
  <!-- Lab Equipment -->
  <g>
    <!-- Central Control Console -->
    <rect fill="#222" x="240" y="220" width="160" height="80" rx="5" />
    <rect class="glow1" fill="#333" x="250" y="230" width="140" height="30" rx="3" />
    
    <!-- Console Screens -->
    <rect class="accent1" x="260" y="235" width="50" height="20" rx="2" opacity="0.7" />
    <rect class="accent2" x="330" y="235" width="50" height="20" rx="2" opacity="0.7" />
    
    <!-- Console Buttons -->
    <circle class="accent3 glow3" cx="270" cy="280" r="8" />
    <circle class="accent4 glow4" cx="300" cy="280" r="8" />
    <circle class="accent2 glow2" cx="330" cy="280" r="8" />
    <circle class="accent1 glow1" cx="360" cy="280" r="8" />
  </g>
  
  <!-- Laboratory Glassware -->
  <g transform="translate(140, 180)">
    <!-- Flask 1 -->
    <g class="glow1">
      <path class="accent1" d="M0,0 L-10,30 C-15,40 -15,60 0,60 C15,60 15,40 10,30 L0,0 Z" opacity="0.7" />
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#555" stroke-width="2" />
      <circle fill="#333" cx="0" cy="-20" r="5" />
    </g>
  </g>
  
  <g transform="translate(180, 160)">
    <!-- Flask 2 -->
    <g class="glow2">
      <path class="accent2" d="M0,0 L-15,40 C-20,50 -20,70 0,70 C20,70 20,50 15,40 L0,0 Z" opacity="0.7" />
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#555" stroke-width="2" />
      <circle fill="#333" cx="0" cy="-20" r="5" />
    </g>
  </g>
  
  <!-- Test Tubes -->
  <g transform="translate(500, 180)">
    <g class="glow3">
      <rect fill="#222" x="-40" y="0" width="80" height="20" rx="3" />
      
      <!-- Tube 1 -->
      <rect fill="#333" x="-35" y="-40" width="10" height="40" rx="5" />
      <rect class="accent3" x="-35" y="-20" width="10" height="20" rx="0" opacity="0.7" />
      
      <!-- Tube 2 -->
      <rect fill="#333" x="-15" y="-50" width="10" height="50" rx="5" />
      <rect class="accent1" x="-15" y="-30" width="10" height="30" rx="0" opacity="0.7" />
      
      <!-- Tube 3 -->
      <rect fill="#333" x="5" y="-45" width="10" height="45" rx="5" />
      <rect class="accent2" x="5" y="-25" width="10" height="25" rx="0" opacity="0.7" />
      
      <!-- Tube 4 -->
      <rect fill="#333" x="25" y="-55" width="10" height="55" rx="5" />
      <rect class="accent4" x="25" y="-35" width="10" height="35" rx="0" opacity="0.7" />
    </g>
  </g>
  
  <!-- Holographic Display -->
  <g transform="translate(320, 140)">
    <circle class="glow1" fill="#222" cx="0" cy="0" r="50" opacity="0.3" />
    
    <!-- Hologram -->
    <g opacity="0.7">
      <path class="accent1" d="M0,-30 L20,20 L-20,20 Z" />
      <path class="accent1" d="M0,30 L20,-20 L-20,-20 Z" />
      
      <!-- Orbiting Data Points -->
      <g transform="rotate(30, 0, 0)">
        <circle class="accent2" cx="0" cy="-40" r="3" />
        <circle class="accent3" cx="35" cy="20" r="3" />
        <circle class="accent4" cx="-35" cy="20" r="3" />
      </g>
    </g>
    
    <!-- Base -->
    <circle fill="#333" cx="0" cy="40" r="10" />
    <rect fill="#444" x="-5" y="30" width="10" height="10" />
  </g>
  
  <!-- Agent Monitoring Stations -->
  <g>
    <!-- Agent Screens -->
    <g transform="translate(100, 120)">
      <rect fill="#333" x="-30" y="-20" width="60" height="40" rx="3" />
      <text class="text" x="0" y="5" text-anchor="middle" font-size="10">HARRY</text>
    </g>
    
    <g transform="translate(100, 180)">
      <rect fill="#333" x="-30" y="-20" width="60" height="40" rx="3" />
      <text class="text" x="0" y="5" text-anchor="middle" font-size="10">MANDY</text>
    </g>
    
    <g transform="translate(540, 120)">
      <rect fill="#333" x="-30" y="-20" width="60" height="40" rx="3" />
      <text class="text" x="0" y="5" text-anchor="middle" font-size="10">SAL</text>
    </g>
    
    <g transform="translate(540, 180)">
      <rect fill="#333" x="-30" y="-20" width="60" height="40" rx="3" />
      <text class="text" x="0" y="5" text-anchor="middle" font-size="10">CRAIG</text>
    </g>
  </g>
  
  <!-- Warning Lights -->
  <g transform="translate(60, 80)">
    <circle class="accent4 glow4" cx="0" cy="0" r="10" opacity="0.7" />
  </g>
  
  <g transform="translate(580, 80)">
    <circle class="accent4 glow4" cx="0" cy="0" r="10" opacity="0.7" />
  </g>
  
  <!-- Title -->
  <g transform="translate(320, 40)">
    <text class="text title" x="0" y="0" text-anchor="middle">THE LAB</text>
    <text class="text subtitle" x="0" y="30" text-anchor="middle">Advanced Agent Development Facility</text>
  </g>
  
  <!-- Restricted Access Badge -->
  <g transform="translate(70, 40)">
    <rect fill="#dc3545" x="-40" y="-15" width="80" height="30" rx="5" />
    <text class="text" x="0" y="5" text-anchor="middle" font-weight="bold" font-size="12">RESTRICTED</text>
  </g>
  
  <!-- Energy Connections -->
  <g stroke="#6f42c1" stroke-width="1" opacity="0.5">
    <path d="M320,140 L180,160 L140,180 L100,180" fill="none" />
    <path d="M320,140 L500,180" fill="none" />
    <path d="M320,140 L320,220" fill="none" />
  </g>
</svg>