<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1e1e1e; }
    .accent { fill: #20c997; }
    .text { fill: #fff; font-family: Arial, sans-serif; }
    .title { font-size: 42px; font-weight: bold; }
    .subtitle { font-size: 24px; }
    .glow { filter: drop-shadow(0 0 10px #20c997); }
    .icon { fill: #20c997; }
  </style>
  
  <!-- Background -->
  <rect class="bg" x="0" y="0" width="640" height="320" rx="10" />
  
  <!-- Streaming Wave Pattern -->
  <g opacity="0.2">
    <path class="accent" d="M0,120 C80,80 160,160 240,120 C320,80 400,160 480,120 C560,80 640,160 640,120 L640,320 L0,320 Z" />
    <path class="accent" d="M0,180 C80,140 160,220 240,180 C320,140 400,220 480,180 C560,140 640,220 640,180 L640,320 L0,320 Z" opacity="0.7" />
    <path class="accent" d="M0,240 C80,200 160,280 240,240 C320,200 400,280 480,240 C560,200 640,280 640,240 L640,320 L0,320 Z" opacity="0.4" />
  </g>
  
  <!-- Streaming Icons -->
  <g class="icon" opacity="0.4" transform="translate(60, 200)">
    <circle cx="0" cy="0" r="30" />
    <polygon points="0,-15 15,15 -15,15" transform="rotate(90, 0, 0)" />
  </g>
  
  <g class="icon" opacity="0.4" transform="translate(180, 220)">
    <circle cx="0" cy="0" r="20" />
    <polygon points="0,-10 10,10 -10,10" transform="rotate(90, 0, 0)" />
  </g>
  
  <g class="icon" opacity="0.4" transform="translate(300, 200)">
    <circle cx="0" cy="0" r="30" />
    <polygon points="0,-15 15,15 -15,15" transform="rotate(90, 0, 0)" />
  </g>
  
  <g class="icon" opacity="0.4" transform="translate(420, 220)">
    <circle cx="0" cy="0" r="20" />
    <polygon points="0,-10 10,10 -10,10" transform="rotate(90, 0, 0)" />
  </g>
  
  <g class="icon" opacity="0.4" transform="translate(540, 200)">
    <circle cx="0" cy="0" r="30" />
    <polygon points="0,-15 15,15 -15,15" transform="rotate(90, 0, 0)" />
  </g>
  
  <!-- Main Text -->
  <g transform="translate(60, 100)">
    <text class="text title" x="0" y="0">STREAM LIMITLESS</text>
    <text class="text subtitle" x="0" y="40">Trial Junkie Agents Never Quit</text>
    
    <!-- Services -->
    <g opacity="0.8" font-size="14" font-weight="bold" fill="#fff">
      <text x="0" y="80">NETFLIX</text>
      <text x="100" y="80">HULU</text>
      <text x="170" y="80">HBO MAX</text>
      <text x="280" y="80">DISNEY+</text>
      <text x="380" y="80">PRIME</text>
      <text x="460" y="80">SPOTIFY</text>
    </g>
  </g>
  
  <!-- TV Screen -->
  <g transform="translate(500, 80)">
    <rect x="-40" y="-40" width="120" height="80" rx="5" fill="#333" />
    <rect x="-35" y="-35" width="110" height="70" rx="3" fill="#111" />
    
    <!-- Screen Content -->
    <g class="glow">
      <rect class="accent" x="-25" y="-25" width="40" height="25" opacity="0.7" />
      <rect class="accent" x="20" y="-25" width="40" height="25" opacity="0.5" />
      <rect class="accent" x="-25" y="5" width="90" height="20" opacity="0.3" />
    </g>
  </g>
  
  <!-- Trial Card -->
  <g transform="translate(320, 240)">
    <rect class="glow" x="-100" y="-30" width="200" height="60" rx="10" fill="#333" />
    <text class="text" x="0" y="0" text-anchor="middle" font-weight="bold" font-size="16">GET FREE ACCESS NOW</text>
    <text class="text" x="0" y="20" text-anchor="middle" font-size="12">Use "!hit netflix" in Discord</text>
  </g>
  
  <!-- Discord Logo -->
  <g transform="translate(80, 70)">
    <circle cx="0" cy="0" r="30" fill="#5865F2" class="glow" />
    <path fill="#fff" d="M-15,-5 C-15,-12 -5,-18 5,-18 L5,-18 C15,-18 25,-12 25,-5 L25,-5 C25,12 15,18 5,18 L5,18 C-5,18 -15,12 -15,-5 L-15,-5 Z M-10,-5 C-10,0 -7,5 -3,5 L-3,5 C1,5 4,0 4,-5 L4,-5 C4,-10 1,-15 -3,-15 L-3,-15 C-7,-15 -10,-10 -10,-5 L-10,-5 Z M16,-5 C16,0 13,5 9,5 L9,5 C5,5 2,0 2,-5 L2,-5 C2,-10 5,-15 9,-15 L9,-15 C13,-15 16,-10 16,-5 L16,-5 Z" transform="scale(0.8)" />
  </g>
</svg>