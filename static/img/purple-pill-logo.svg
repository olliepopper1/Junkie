<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple pill with glow effect -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Pill outline -->
  <g filter="url(#glow)">
    <path d="M150,50 L350,50 C390,50 420,75 420,100 C420,125 390,150 350,150 L150,150 C110,150 80,125 80,100 C80,75 110,50 150,50 Z" 
          fill="none" stroke="#c291ff" stroke-width="10"/>
  </g>
  
  <!-- Text "Trial Junkie" -->
  <text x="450" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#c291ff" filter="url(#glow)">
    Trial Junkie
  </text>
</svg>