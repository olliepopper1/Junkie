<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1e1e1e; }
    .accent { fill: #6f42c1; }
    .text { fill: #fff; font-family: Arial, sans-serif; }
    .title { font-size: 48px; font-weight: bold; }
    .subtitle { font-size: 24px; }
    .glow { filter: drop-shadow(0 0 10px #6f42c1); }
    .icon { fill: #6f42c1; }
  </style>
  
  <!-- Background -->
  <rect class="bg" x="0" y="0" width="640" height="320" rx="10" />
  
  <!-- Glow Effects -->
  <g opacity="0.1">
    <circle class="accent" cx="100" cy="80" r="200" />
    <circle class="accent" cx="540" cy="240" r="200" />
  </g>
  
  <!-- Pattern -->
  <g opacity="0.3" stroke="#6f42c1" stroke-width="1">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="280" x2="640" y2="280" />
  </g>
  
  <!-- Logo -->
  <g class="glow" transform="translate(50, 40) scale(0.8)">
    <!-- Skull -->
    <path fill="#3a3a3a" d="M30,40 C30,30 70,30 70,40 L70,65 C70,75 30,75 30,65 Z" />
    <ellipse class="accent" cx="40" cy="50" rx="8" ry="10" />
    <ellipse class="accent" cx="60" cy="50" rx="8" ry="10" />
    <path fill="#222" d="M50,58 L45,65 L55,65 Z" />
    <path fill="#333" d="M35,65 C35,75 65,75 65,65 L65,68 C65,80 35,80 35,68 Z" />
    <rect fill="#eee" x="38" y="65" width="4" height="5" />
    <rect fill="#eee" x="44" y="65" width="4" height="5" />
    <rect fill="#eee" x="50" y="65" width="4" height="5" />
    <rect fill="#eee" x="56" y="65" width="4" height="5" />
    
    <!-- Syringe -->
    <g transform="rotate(45, 50, 50)">
      <rect class="accent" x="30" y="48" width="40" height="4" rx="2" />
      <rect fill="#eee" x="30" y="48" width="25" height="4" rx="2" opacity="0.5" />
      <rect class="accent" x="25" y="46" width="5" height="8" rx="2" />
      <rect fill="#ccc" x="70" y="48" width="10" height="4" />
      <path fill="#ccc" d="M80,46 L85,50 L80,54 Z" />
      <rect class="accent" x="30" y="48" width="12" height="4" rx="0" opacity="0.7" />
    </g>
  </g>
  
  <!-- Main Text -->
  <g transform="translate(160, 140)">
    <text class="text title" x="0" y="0">GET YOUR DIGITAL FIX</text>
    <text class="text subtitle" x="0" y="40">Free trials on demand with Trial Junkie</text>
    
    <!-- CTA -->
    <g transform="translate(150, 100)">
      <rect class="accent glow" x="-100" y="-25" width="200" height="50" rx="25" />
      <text class="text" x="0" y="5" text-anchor="middle" font-size="20" font-weight="bold">START NOW</text>
    </g>
  </g>
  
  <!-- Icons -->
  <g class="glow icon" transform="translate(40, 220)">
    <circle cx="0" cy="0" r="20" opacity="0.8" />
    <path fill="#fff" d="M-10,-10 L10,10 M-10,10 L10,-10" stroke="#fff" stroke-width="4" />
  </g>
  
  <g class="glow icon" transform="translate(600, 100)">
    <circle cx="0" cy="0" r="20" opacity="0.8" />
    <path fill="#fff" d="M-10,-10 L10,10 M-10,10 L10,-10" stroke="#fff" stroke-width="4" />
  </g>
  
  <!-- Referral Code -->
  <g transform="translate(480, 40)">
    <rect fill="#333" x="0" y="0" width="120" height="30" rx="5" />
    <text class="text" x="60" y="20" text-anchor="middle" font-size="14">USE CODE: TJ2025</text>
  </g>
</svg>