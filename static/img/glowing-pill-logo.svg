<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Pill Icon with Glow Effect -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Pill -->
  <g filter="url(#glow)">
    <path d="M15,10 L25,10 C30,10 33,13 33,18 C33,23 30,26 25,26 L15,26 C10,26 7,23 7,18 C7,13 10,10 15,10 Z" 
          fill="#261E35" stroke="#c291ff" stroke-width="1.5"/>
    
    <!-- Pill Line -->
    <line x1="20" y1="10" x2="20" y2="26" stroke="#c291ff" stroke-width="1" />
  </g>

  <!-- Trial Junkie Text -->
  <text x="40" y="22" font-family="Audiowide, sans-serif" font-size="14" fill="#c291ff" filter="url(#glow)">
    Trial Junkie
  </text>
</svg>