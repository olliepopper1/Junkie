<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .base { fill: #000000; }
    .skull { fill: #f0ebd7; }
    .eyes { fill: #e34234; }
    .smoke { fill: #b0b0b0; opacity: 0.7; }
    .cigarette { fill: #ffffff; }
    .hoodie { fill: #6f42c1; }
    .text { fill: #ff8c00; font-family: 'Impact', sans-serif; font-weight: bold; }
  </style>
  
  <!-- Background -->
  <circle class="base" cx="50" cy="50" r="48"/>
  
  <!-- Hoodie -->
  <path class="hoodie" d="M25,55 C25,40 75,40 75,55 L75,90 C75,90 65,85 50,85 C35,85 25,90 25,90 Z" />
  
  <!-- Skull -->
  <path class="skull" d="M30,45 C30,30 70,30 70,45 L70,70 C70,80 30,80 30,70 Z" />
  
  <!-- Eyes -->
  <path class="eyes" d="M38,50 C42,45 48,50 42,55 Z" />
  <path class="eyes" d="M62,50 C58,45 52,50 58,55 Z" />
  
  <!-- Cigarette -->
  <rect class="cigarette" x="40" y="65" width="20" height="3" rx="1.5" />
  <rect fill="#ff4500" x="58" y="65" width="2" height="3" rx="1" />
  
  <!-- Smoke -->
  <path class="smoke" d="M60,60 C65,55 62,52 64,48 C66,44 62,42 60,45 C58,48 54,50 56,53 C58,56 58,58 60,60 Z" />
  
  <!-- Text -->
  <g class="text" text-anchor="middle">
    <text x="50" y="97" font-size="14">TRIAL JUNKIES</text>
  </g>
