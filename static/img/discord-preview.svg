<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Discord application background -->
  <rect width="600" height="400" rx="10" fill="#36393F"/>
  
  <!-- Discord Channel List -->
  <rect x="10" y="10" width="100" height="380" fill="#2F3136" rx="5"/>
  
  <!-- Server Icon -->
  <circle cx="60" cy="40" r="20" fill="#7289DA"/>
  <text x="60" y="45" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">TJ</text>
  
  <!-- Channel Names -->
  <rect x="20" y="80" width="80" height="20" rx="3" fill="#42464D"/>
  <text x="30" y="94" font-family="Arial, sans-serif" font-size="10" fill="#8E9297"># general</text>
  
  <rect x="20" y="110" width="80" height="20" rx="3" fill="#42464D"/>
  <text x="30" y="124" font-family="Arial, sans-serif" font-size="10" fill="#8E9297"># trials</text>
  
  <rect x="20" y="140" width="80" height="20" rx="3" fill="#7289DA"/>
  <text x="30" y="154" font-family="Arial, sans-serif" font-size="10" fill="white"># commands</text>
  
  <!-- Chat Area -->
  <rect x="120" y="10" width="470" height="380" rx="5" fill="#36393F"/>
  
  <!-- Chat Header -->
  <rect x="120" y="10" width="470" height="40" rx="5" fill="#36393F" stroke="#42464D" stroke-width="1"/>
  <text x="150" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold"># commands</text>
  
  <!-- Messages -->
  <!-- User Message -->
  <circle cx="150" cy="80" r="20" fill="#7289DA"/>
  <text x="150" y="85" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">U</text>
  <text x="180" y="70" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">User123</text>
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="10" fill="#72767D">Today at 12:34 PM</text>
  <text x="180" y="90" font-family="Arial, sans-serif" font-size="14" fill="#DCDDDE">!hit netflix</text>
  
  <!-- Bot Response -->
  <circle cx="150" cy="150" r="20" fill="#FF5555"/>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">TJ</text>
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="14" fill="#7289DA" font-weight="bold">Trial Junkie</text>
  <text x="250" y="140" font-family="Arial, sans-serif" font-size="10" fill="#72767D">Today at 12:34 PM</text>
  
  <!-- Embed -->
  <rect x="180" y="160" width="370" height="140" rx="5" fill="#2F3136"/>
  <rect x="180" y="160" width="5" height="140" rx="2" fill="#FF5555"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">Netflix Trial Generated</text>
  
  <!-- Embed Content -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="12" fill="#DCDDDE">Email: user123@example.com</text>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="12" fill="#DCDDDE">Password: ••••••••••••</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="12" fill="#DCDDDE">Expires: May 27, 2025</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="12" fill="#DCDDDE">Created by Heroin Harry, Meth Mandy, and Shroomy Sal</text>
  
  <!-- Input Box -->
  <rect x="130" y="360" width="450" height="20" rx="10" fill="#40444B"/>
  <text x="150" y="375" font-family="Arial, sans-serif" font-size="12" fill="#72767D">Type a command...</text>
</svg>